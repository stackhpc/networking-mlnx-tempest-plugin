[build-system]
requires = ["pbr>=7.1.3"]
build-backend = "pbr.build"

[project]
name = "networking-mlnx-tempest-plugin"
description = "Tempest plugin for networking-mlnx"
authors = [
    {name = "OpenStack", email = "openstack-discuss@lists.openstack.org"},
]
readme = {file = "README.rst", content-type = "text/x-rst"}
license = "Apache-2.0"
dynamic = ["version", "dependencies"]
requires-python = ">=3.9"
classifiers = [
    "Environment :: OpenStack",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
Repository = "https://opendev.org/x/networking-mlnx-tempest-plugin"

[project.entry-points."tempest.test_plugins"]
networking_mlnx_tests = "networking_mlnx_tempest_plugin.plugin:NetworkingMlnxTempestPlugin"

[tool.setuptools.packages.find]
include = ["networking_mlnx_tempest_plugin*"]
