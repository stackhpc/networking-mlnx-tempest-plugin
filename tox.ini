[tox]
envlist = pep8
minversion = 4.28.0
ignore_basepython_conflict = True

[testenv]
basepython = python3
setenv = VIRTUAL_ENV={envdir}
passenv = http_proxy,HTTP_PROXY,https_proxy,HTTPS_PROXY,no_proxy,NO_PROXY
usedevelop = True
install_command =
  pip install {opts} {packages}
constraints =
  {env:TOX_CONSTRAINTS_FILE:https://releases.openstack.org/constraints/upper/master}
deps =
  -r{toxinidir}/requirements.txt

[testenv:pep8]
deps =
  {[testenv]deps}
  hacking>=8.1.0,<=8.2.0 # Apache-2.0
  flake8-import-order==0.19.2 # LGPLv3
commands =
  flake8
  check-uuid --package networking_mlnx_tempest_plugin

[testenv:venv]
commands = {posargs}

[testenv:docs]
skip_install = true
deps = -r{toxinidir}/doc/requirements.txt
commands = sphinx-build -W -b html doc/source doc/build/html

[testenv:releasenotes]
skip_install = true
allowlist_externals = rm
deps = {[testenv:docs]deps}
commands =
  rm -rf releasenotes/build
  sphinx-build -a -W -E -d releasenotes/build/doctrees -b html releasenotes/source releasenotes/build/html

[flake8]
# H405 multi line docstring summary not separated with an empty line
# W504 line break after binary operator
ignore = H405,W504
# H106: Don't put vim configuration in source files
# H203: Use assertIs(Not)None to check for None
# H204: Use assert(Not)Equal to check for equality
# H205: Use assert(Greater|Less)(Equal) for comparison
# H904: Delay string interpolations at logging calls
enable-extensions = H106,H203,H204,H205,H904
show-source = true
exclude = ./.*,build,dist,doc
import-order-style = pep8
application-import-names = networking_mlnx_tempest_plugin
